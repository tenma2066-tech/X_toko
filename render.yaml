databases:
  - name: x-toko-db
    plan: free
    databaseName: x_toko
    ipAllowList: []

services:
  - type: web
    name: x-toko
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: x-toko-db
          property: connectionString
      - key: X_USERNAME
        sync: false
      - key: X_EMAIL
        sync: false
      - key: X_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TZ
        value: Asia/Tokyo
      - key: PYTHON_VERSION
        value: "3.12"
